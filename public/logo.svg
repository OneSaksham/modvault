<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.22"/>
      <stop offset="45%" stop-color="#06b6d4" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0b0f14" stop-opacity="0"/>
    </radialGradient>
    
    <!-- Emerald & Cyan Neon Glow Filters -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur1"/>
      <feGaussianBlur stdDeviation="20" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="intenseGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.06  0 0 0 0 0.72  0 0 0 0 0.50  0 0 0 0.7 0"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Linear Gradients for Isometric Cube Facets -->
    <!-- Top Face (Emerald Gem Core) -->
    <linearGradient id="topFaceGrad" x1="256" y1="80" x2="256" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Top Face Circuit Overlay -->
    <linearGradient id="circuitGrad" x1="140" y1="160" x2="370" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="50%" stop-color="#a7f3d0"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>

    <!-- Left Face (Deep Obsidian Emerald Shade) -->
    <linearGradient id="leftFaceGrad" x1="120" y1="160" x2="256" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f2922"/>
      <stop offset="35%" stop-color="#064e3b"/>
      <stop offset="85%" stop-color="#091b17"/>
      <stop offset="100%" stop-color="#051310"/>
    </linearGradient>

    <!-- Right Face (Cyan Obsidian Shadow) -->
    <linearGradient id="rightFaceGrad" x1="392" y1="160" x2="256" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#065f46"/>
      <stop offset="30%" stop-color="#083344"/>
      <stop offset="75%" stop-color="#08202b"/>
      <stop offset="100%" stop-color="#041117"/>
    </linearGradient>

    <!-- Outer Obsidian Armor Shield -->
    <linearGradient id="shieldGrad" x1="256" y1="40" x2="256" y2="470" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070c12"/>
    </linearGradient>

    <!-- Metallic Border Stroke Gradient -->
    <linearGradient id="borderGrad" x1="100" y1="50" x2="412" y2="460" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="30%" stop-color="#06b6d4"/>
      <stop offset="70%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <!-- Vault Core Keyhole Glow -->
    <radialGradient id="keyholeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a7f3d0"/>
      <stop offset="40%" stop-color="#34d399"/>
      <stop offset="80%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </radialGradient>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="256" cy="245" r="210" fill="url(#bgGlow)"/>

  <!-- Outer Tech Shield Crest (Clipped Obsidian Hexagonal Shield) -->
  <polygon points="256,42 416,112 416,330 256,462 96,330 96,112" 
           fill="url(#shieldGrad)" 
           stroke="url(#borderGrad)" 
           stroke-width="5" 
           stroke-linejoin="round"
           filter="url(#intenseGlow)"/>

  <!-- Inner Armor Inset Lines -->
  <polygon points="256,64 396,126 396,316 256,436 116,316 116,126" 
           fill="#0b1118" 
           stroke="#1e2d3d" 
           stroke-width="2.5" 
           stroke-linejoin="round"/>

  <!-- Minecraft Pixel Grid Geometric Guide Accents (Esports Tech Markings) -->
  <path d="M120 180 L160 160 M392 180 L352 160 M256 70 L256 100 M256 405 L256 430" 
        stroke="#06b6d4" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>

  <!-- Corner Tech Brackets -->
  <path d="M136 142 L136 130 L156 120" stroke="#10b981" stroke-width="3" fill="none" opacity="0.8"/>
  <path d="M376 142 L376 130 L356 120" stroke="#10b981" stroke-width="3" fill="none" opacity="0.8"/>
  <path d="M136 295 L136 308 L156 318" stroke="#06b6d4" stroke-width="3" fill="none" opacity="0.8"/>
  <path d="M376 295 L376 308 L356 318" stroke="#06b6d4" stroke-width="3" fill="none" opacity="0.8"/>

  <!-- ================= MASTER ISOMETRIC EMERALD CUBE ================= -->
  <!-- Top Isometric Rhombus Face -->
  <polygon points="256,104 366,168 256,232 146,168" 
           fill="url(#topFaceGrad)" 
           stroke="#6ee7b7" 
           stroke-width="2" 
           stroke-linejoin="round"/>

  <!-- Top Face Pixelated Facet Geometry (Minecraft Emerald Texture Style) -->
  <polygon points="256,104 311,136 256,168 201,136" fill="#6ee7b7" opacity="0.5"/>
  <polygon points="256,168 311,136 366,168 311,200" fill="#059669" opacity="0.4"/>
  <polygon points="146,168 201,136 256,168 201,200" fill="#34d399" opacity="0.6"/>
  <polygon points="201,200 256,168 311,200 256,232" fill="#047857" opacity="0.7"/>

  <!-- Left Isometric Side Face (Shadow/Deep Emerald-Obsidian) -->
  <polygon points="146,168 256,232 256,368 146,304" 
           fill="url(#leftFaceGrad)" 
           stroke="#059669" 
           stroke-width="2" 
           stroke-linejoin="round"/>

  <!-- Left Face Faceted Minecraft Texture Overlay -->
  <polygon points="146,168 201,200 201,268 146,236" fill="#047857" opacity="0.45"/>
  <polygon points="201,200 256,232 256,300 201,268" fill="#10b981" opacity="0.2"/>
  <polygon points="146,236 201,268 201,336 146,304" fill="#022c22" opacity="0.6"/>
  <polygon points="201,268 256,300 256,368 201,336" fill="#064e3b" opacity="0.4"/>

  <!-- Right Isometric Side Face (Cyan Cyan-Obsidian Glow) -->
  <polygon points="256,232 366,168 366,304 256,368" 
           fill="url(#rightFaceGrad)" 
           stroke="#0891b2" 
           stroke-width="2" 
           stroke-linejoin="round"/>

  <!-- Right Face Faceted Minecraft Texture Overlay -->
  <polygon points="256,232 311,200 311,268 256,300" fill="#0e7490" opacity="0.3"/>
  <polygon points="311,200 366,168 366,236 311,268" fill="#083344" opacity="0.5"/>
  <polygon points="256,300 311,268 311,336 256,368" fill="#155e75" opacity="0.25"/>
  <polygon points="311,268 366,236 366,304 311,336" fill="#04202c" opacity="0.7"/>

  <!-- ================= CENTRAL VAULT EMBLEM & CYBER LOCK ================= -->
  <!-- Floating Diamond Vault Core (Front Focus) -->
  <g filter="url(#neonGlow)">
    <!-- Vault Outer Shackle Ring / Heavy Lock Body -->
    <path d="M228 205 C228 188 284 188 284 205 L284 235 L228 235 Z" 
          fill="#0f172a" 
          stroke="#34d399" 
          stroke-width="4.5"/>
    <circle cx="256" cy="210" r="12" fill="#064e3b" stroke="#6ee7b7" stroke-width="2"/>

    <!-- Vault Padlock Body (Chiseled Bevel) -->
    <polygon points="214,232 298,232 310,296 256,326 202,296" 
             fill="#090d14" 
             stroke="#10b981" 
             stroke-width="4" 
             stroke-linejoin="round"/>

    <!-- Inner Keyhole Inset (Glowing Cyber Port) -->
    <circle cx="256" cy="262" r="14" fill="url(#keyholeGlow)" stroke="#a7f3d0" stroke-width="2"/>
    <polygon points="250,266 262,266 266,286 246,286" fill="url(#keyholeGlow)"/>

    <!-- Cyber Circuit Nodes branching from Keyhole -->
    <path d="M256 296 L256 316" stroke="#34d399" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M224 254 L208 254 L204 266" stroke="#06b6d4" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <path d="M288 254 L304 254 L308 266" stroke="#06b6d4" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Glowing Laser Edge Highlight Lines on Isometric Core -->
  <line x1="256" y1="104" x2="256" y2="232" stroke="#a7f3d0" stroke-width="2.5" opacity="0.8"/>
  <line x1="146" y1="168" x2="256" y2="232" stroke="#6ee7b7" stroke-width="2" opacity="0.6"/>
  <line x1="366" y1="168" x2="256" y2="232" stroke="#67e8f9" stroke-width="2" opacity="0.6"/>

  <!-- High-Energy Sparkles / Particle Stars -->
  <polygon points="172,118 175,126 183,129 175,132 172,140 169,132 161,129 169,126" fill="#a7f3d0"/>
  <polygon points="348,270 350,276 356,278 350,280 348,286 346,280 340,278 346,276" fill="#67e8f9"/>
  <circle cx="256" cy="72" r="3" fill="#34d399" filter="url(#neonGlow)"/>
</svg>